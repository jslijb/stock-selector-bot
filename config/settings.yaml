project:
  name: "cognitive-stock-agent"
  version: "0.1.0"

database:
  duckdb_path: "./data/stock_agent.duckdb"

tushare:
  token_env: "TUSHARE_TOKEN"
  rate_limit: 200

# LLM配置已移至 config/llm_config.yaml（支持热加载）
# 修改 llm_config.yaml 后自动生效，无需重启

embedding:
  model_name: "BAAI/bge-large-zh-v1.5"
  device: "cpu"
  model_path: "D:\\models\\modelscope\\BAAI\\bge-large-zh-v1___5"

chromadb:
  persist_dir: "./data/chroma_db"
  collection_name: "market_state_memory"

factors:
  count: 150
  neutralization: "industry"
  extreme_value_method: "mad"
  zscore_window: 252

reasoning:
  layer1_top_pct: 0.20
  layer2_top_n: 50
  layer3_final_n: 20

risk:
  max_single_weight: 0.10
  industry_deviation: 0.05

  max_price: 100.0
  min_market_cap: 100.0
  min_turnover_rate: 2.0
  min_avg_amount: 5000.0
  min_revenue: 5.0
  max_pe_noncyclical: 50.0
  exclude_st: true
  enable_bj: false
  enable_kcb: false
  bj_min_market_cap: 10.0
  kcb_min_market_cap: 15.0

  # 行业黑名单（含这些关键词的行业全部剔除）
  excluded_industries:
    - 房地产
    - 纺织制造
    - 服装
    - 影视
    - 院线

  # 周期性行业（需满足负债上限）
  cyclical_industries:
    - 煤炭
    - 石油石化
    - 有色金属
    - 贵金属
    - 小金属
    - 钢铁
    - 基础化工
    - 建筑材料
    - 水泥
    - 玻璃玻纤
    - 工程机械
    - 通用设备
    - 轨交设备
    - 电网设备
    - 锂电
    - 汽车
    - 乘用车
    - 家电
    - 航运
    - 航空
    - 船舶制造
    - 证券
    - 保险
  cyclical_max_debt_ratio: 70.0

evolution:
  frequency: "monthly"
  ic_window_months: 3
  weight_bounds: [0.01, 0.30]

scheduler:
  check_missing: true
  auto_backfill: true

moneyflow:
  max_workers: 4
  stock_interval: 1.0
